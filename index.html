    body{

    }

    h1{
      margin-top: 30px;

      color: #38bdf8;
      letter-spacing: 1px;

    .container{
      max-width: 900px;
      margin: 40px auto;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      padding: 20px;
    }

    a{
      text-decoration: none;
      background: #1e293b;
      color: #38bdf8;
      padding: 18px;
      border-radius: 12px;
      font-weight: bold;
      border: 1px solid #334155;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    a::before{
      content: "";
      position: absolute;
      width: 100%;
      height: 100%;
      background: linear-gradient(120deg, transparent, #38bdf8, transparent);
      top: 0;
      left: -100%;
      transition: 0.5s;
    }

    a:hover::before{
      left: 100%;
    }

    a:hover{
      transform: translateY(-5px) scale(1.03);
      box-shadow: 0 0 15px #38bdf8;
      background: #020617;
      color: white;
    }

    footer{
      margin: 20px;
      font-size: 14px;
      color: #94a3b8;
    }
