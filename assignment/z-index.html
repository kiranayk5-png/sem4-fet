<!DOCTYPE html>
<html>
<head>
    <title>My Portfolio</title>

    <style>
        body{
            margin:0;
            font-family:Arial;
            background:#fff7f0;
        }

        /* Shapes (background) */
        .circle{
            position:absolute;
            width:300px;
            height:300px;
            background:#ffd6a5;
            border-radius:50%;
            top:50%;
            left:40%;
            transform:translate(-50%,-50%);
            z-index:-1;
        }

        .square{
            position:absolute;
            width:300px;
            height:250px;
            background:#caffbf;
            top:50%;
            left:60%;
            transform:translate(-50%,-50%) rotate(10deg);
            z-index:-1;
        }

        /* Content */
        section{
            text-align:center;
            padding:60px;
        }

        h1{ color:#1d3557; }
        h2{ color:#e76f51; }
        h3{ color:#2a9d8f; }
        p{ color:#444; }

        .dash{
            width:100px;
            height:4px;
            background:#e76f51;
            margin:15px auto;
        }

        button{
            padding:10px 20px;
            background:#2a9d8f;
            color:white;
            border:none;
            cursor:pointer;
        }
    </style>
</head>

<body>

    <div class="circle"></div>
    <div class="square"></div>

    <section>
        <h1>Hi, I'm Kirana Y K</h1>
        <h2>Aspiring Software Engineer</h2>

        <div class="dash"></div>

        <h3>Building Efficient Solutions</h3>
        <p>I love creating simple programs.</p>

        <button onclick="showMsg()">Click Me</button>
    </section>

    <script>
        function showMsg(){
            alert("Thanks for visiting!");
        }
    </script>

</body>
</html>
