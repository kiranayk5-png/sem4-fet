<!DOCTYPE html>
<html>
<head>
    <title>Z-Index Toggle</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
        }

        /* Center container */
        .container {
            position: relative;
            width: 300px;
            height: 300px;
            margin: 50px auto;
        }

        .box {
            width: 150px;
            height: 150px;
            position: absolute;
            border-radius: 10px;
            transition: 0.3s;
        }

        /* Center overlapping boxes */
        #box1 {
            background: red;
            top: 50%;
            left: 50%;
            transform: translate(-60%, -60%);
            z-index: 1;
        }

        #box2 {
            background: blue;
            top: 50%;
            left: 50%;
            transform: translate(-40%, -40%);
            z-index: 2;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            border-radius: 6px;
            background: black;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: gray;
        }
        h2{
            margin: 50px;
        }
    </style>
</head>

<body>

<h2>Z-Index Toggle</h2>

<div class="container">
    <div id="box1" class="box"></div>
    <div id="box2" class="box"></div>
</div>

<button onclick="toggleZ()">Toggle Layers</button>

<script>
function toggleZ() {
    let red = document.getElementById("box1");
    let blue = document.getElementById("box2");

    if (red.style.zIndex == "3") {
        red.style.zIndex = "1";
        blue.style.zIndex = "2";
    } else {
        red.style.zIndex = "3";
        blue.style.zIndex = "1";
    }
}
</script>

</body>
</html>
