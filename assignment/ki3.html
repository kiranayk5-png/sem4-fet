<!DOCTYPE html>
<html>
<head>
    <title>Hire Me Contact Form</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f0f4ff;
        }

        h2 {
            text-align: center;
            color: #1e3a8a;
        }

        form {
            width: 320px;
            margin: auto;
            background: #ffffff;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #c7d2fe;
        }

        input, select, textarea {
            width: 100%;
            margin: 6px 0;
            padding: 7px;
            border: 1px solid #93c5fd;
            border-radius: 4px;
        }

        fieldset {
            margin-top: 10px;
            border: 1px solid #93c5fd;
            border-radius: 5px;
            padding: 10px;
        }

        legend {
            color: #2563eb;
            font-weight: bold;
        }

        button {
            width: 100%;
            padding: 8px;
            margin-top: 10px;
            border: none;
            color: white;
            cursor: pointer;
            background-color: #2563eb;
        }

        #output {
            width: 320px;
            margin: 15px auto;
            background: #ffffff;
            padding: 10px;
            border-radius: 8px;
            border-left: 5px solid #2563eb;
        }
    </style>

    <script>
        function saveData(event) {
            event.preventDefault();

            let name = document.getElementById("name").value;
            let email = document.getElementById("email").value;
            let dob = document.getElementById("dob").value;  // ✅ DOB added

            let gender = document.querySelector('input[name="gender"]:checked');
            gender = gender ? gender.value : "Not selected";

            let skills = document.getElementsByName("skills");
            let selectedSkills = "";

            for (let i = 0; i < skills.length; i++) {
                if (skills[i].checked) {
                    selectedSkills += skills[i].value + ", ";
                }
            }

            if (selectedSkills === "") {
                selectedSkills = "None";
            }

            document.getElementById("output").innerHTML =
                "<h3>Submitted Details</h3>" +
                "Name: " + name + "<br>" +
                "Email: " + email + "<br>" +
                "DOB: " + dob + "<br>" +   // ✅ show DOB
                "Gender: " + gender + "<br>" +
                "Skills: " + selectedSkills;
        }
    </script>

</head>

<body>

<h2>Hire Me</h2>

<form onsubmit="saveData(event)">

    <label>Full Name:</label>
    <input type="text" id="name" required>

    <label>Email:</label>
    <input type="email" id="email" required>

    <!-- ✅ DOB FIELD ADDED -->
    <label>Date of Birth:</label>
    <input type="date" id="dob" required>

    <fieldset>
        <legend>Gender</legend>
        <input type="radio" name="gender" value="Male"> Male <br>
        <input type="radio" name="gender" value="Female"> Female <br>
        <input type="radio" name="gender" value="Other"> Other
    </fieldset>

    <fieldset>
        <legend>Skills</legend>
        <input type="checkbox" name="skills" value="HTML"> HTML <br>
        <input type="checkbox" name="skills" value="CSS"> CSS <br>
        <input type="checkbox" name="skills" value="JavaScript"> JavaScript
    </fieldset>

    <button type="submit">Submit</button>

</form>

<div id="output"></div>

</body>
</html>
